name: smart_lab_safety
description: Production-grade IoT Laboratory Safety Monitoring and Control Platform built with Flutter & Firebase Realtime Database.
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.2.0
  firebase_database: ^13.1.0
  firebase_auth: ^7.1.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  fl_chart: ^1.3.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true